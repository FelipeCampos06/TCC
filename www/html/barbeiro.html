<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbeiro</title>
    <link rel="stylesheet" href="../css/barbeiro.css">
</head>
 
<body> 
 
    <!-- CONTEÚDO PRINCIPAL -->
    <div class="container">

        <div class="availability-section">
            <h3>Horários Disponíveis</h3>
            <div class="availability-form">
                <select id="diaSelect">
                    <option value="Terça">Terça</option>
                    <option value="Quarta">Quarta</option>
                    <option value="Quinta">Quinta</option>
                    <option value="Sexta">Sexta</option>
                    <option value="Sábado">Sábado</option>
                </select>
                <input id="horarioInput" type="time" />
                <button id="btnAddHorario" type="button">Adicionar</button>
            </div>
            <div id="availabilityList" class="availability-list"></div>
        </div>

        <div class="cards-container">
            <div class="card">
                <span class="status verde"></span>
                <h3>Andre</h3>
                <p class="hora-card">11:00</p>
                <p class="servico">Corte + Barba</p>
                <p class="tempo">1hr</p>
            </div>
 
            <div class="card">
                <span class="status amarelo"></span>
                <h3>Felipe</h3>
                <p class="hora-card">12:00</p>
                <p class="servico">Corte</p>
                <p class="tempo">30min</p>
            </div>
 
            <div class="card">
                <span class="status vermelho"></span>
                <h3>Gabriel</h3>
                <p class="hora-card">14:00</p>
                <p class="servico">Barba</p>
                <p class="tempo">30min</p>
            </div>
 
            <div class="card">
                <span class="status vermelho"></span>
                <h3>Gustavo</h3>
                <p class="hora-card">15:00</p>
                <p class="servico">Corte + Barba</p>
                <p class="tempo">1hr</p>
            </div>
        </div>

        <div class="opcoes">
            <!-- Perfil -->
            <a href="barbeiro-perfil.html" class="perfil">
                <img src="../img/perfil.png" alt="Perfil" class="icone-perfil">
            </a>
        </div>

<script src="../js/barbeiro.js"></script>

</body>

</html>
