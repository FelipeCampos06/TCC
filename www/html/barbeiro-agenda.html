<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda do Barbeiro</title>
    <link rel="stylesheet" href="../css/agenda.css">
</head>

<body>

    <div class="voltar">
        <a href="barbeiro.html">
            <img src="../img/seta.png" alt="Voltar">
        </a>
    </div>

    <div class="fundo">
        <div class="texto">
            <p>Agenda da Semana</p>
        </div>
    </div>

    <div class="element">

        <div class="dia-card">
            <button class="dias" onclick="selecionarDia('Terça', '../html/terca.html')">
                TERÇA - FEIRA
            </button>
        </div>

        <div class="dia-card">
            <button class="dias" onclick="selecionarDia('Quarta', '../html/quarta.html')">
                QUARTA - FEIRA
            </button>
        </div>

        <div class="dia-card">
            <button class="dias" type="button" onclick="redirectToDayPage('Quinta')">
                QUINTA - FEIRA
            </button>
        </div>

        <div class="dia-card">
            <button class="dias" type="button" onclick="redirectToDayPage('Sexta')">
                SEXTA - FEIRA
            </button>
        </div>

        <div class="dia-card">
            <button class="dias" type="button" onclick="redirectToDayPage('Sábado')">
                SÁBADO
            </button>
        </div>

    </div>

    <script src="../js/dias-utils.js"></script>
    <script src="../js/horarios-utils.js"></script>
    <script src="../js/agenda.js"></script>

</body>

</html>
