<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informações do Agendamento</title>
    <link rel="stylesheet" href="../css/agendado.css">
</head>

<body>
    <div class="voltar">
        <a href="../html/selecao.html">
            <img src="../img/seta.png" alt="Voltar"></a>
    </div>

    <div class="fun">
        <div class="confirmar">
            <div id="mensagemSemAgendamento" class="mensagem-sem-agendamento" style="display: none;">
                <p>Você não possui um agendamento ainda</p>
            </div>

            <div id="conteudoInformacoes" style="display: block;">
                <div class="info-header">
                    <p>Informações do Agendamento</p>
                </div>

                <div class="info-detalhes">
                    <div class="info-item">
                        <span class="info-label">Serviço:</span>
                        <span class="info-valor" id="infoServico">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Valor:</span>
                        <span class="info-valor" id="infoValor">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Dia:</span>
                        <span class="info-valor" id="infoDia">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Horário:</span>
                        <span class="info-valor" id="infoHorario">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/informacoes.js"></script>
</body>

</html>
